<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>help</title>
    <link rel="icon" type="image/png" href="webIcon.jpg">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('backhelp.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            margin: 20px;
        }
        .help-title {
            font-size: 32px;
            font-style: italic;
            color: #888888;
            margin-bottom: 15px;
            font-weight: normal;
        }
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .links-group a {
            font-size: 14px;
            color: #00a2ff;
            text-decoration: none;
            transition: color 0.2s;
            outline: none;
            width: max-content;
        }
        .links-group a:hover {
            text-decoration: underline;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="help-title">help</div>

    <div class="links-group">
        <a href="index.html">Go back</a>
        <a href="help.txt">Open help.txt</a>
    </div>

</body>
</html>
